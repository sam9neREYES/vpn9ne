[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn9ne"
version = "0.1.0"
description = "VPN de terminal multiplataforma (Linux, macOS, Windows) sobre OpenVPN"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
vpn9ne = "vpn9ne.cli:main"

[tool.setuptools]
packages = ["vpn9ne"]
